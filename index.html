<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Leonardo Ramirez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0e17; --bar:#0d1220; --txt:#c9d1d9; --prompt:#38bdf8; --title:#fb923c; --line:#1b2433; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--txt); font: 16px/1.6 "JetBrains Mono", monospace; display: flex; flex-direction: column; }
  header { background: var(--bar); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 8px; align-items: center; color: #6b7686; font-size: 14px; }
  header i { width: 12px; height: 12px; border-radius: 50%; background: #1f2937; display: block; }
  header span { margin-left: 8px; }
  #term { flex: 1; overflow-y: auto; padding: 20px; }
  .p { color: var(--prompt); font-weight: 700; }
  h2 { color: var(--title); font-size: 1em; margin: 14px 0 8px; }
  ul { margin: 0; padding-left: 36px; }
  .row { display: grid; grid-template-columns: 190px 1fr; gap: 12px; }
  .row b { color: var(--prompt); font-weight: 400; }
  .out { margin: 6px 0 18px; }
  .err { color: #f87171; }
  a { color: var(--prompt); }
  .line { display: flex; gap: 10px; }
  #in { flex: 1; background: none; border: 0; outline: 0; color: var(--txt); font: inherit; caret-color: var(--title); }
  nav { border-top: 1px solid var(--line); background: var(--bar); padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; }
  nav button { background: none; color: var(--txt); border: 1px solid #263044; border-radius: 6px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  nav button:hover, nav button:focus-visible { border-color: var(--prompt); color: var(--prompt); outline: 0; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; gap: 0; margin-bottom: 8px; } }
</style>
</head>
<body>
<header><i></i><i></i><i></i><span>lramirez@sistemas:~</span></header>
<main id="term" aria-live="polite"></main>
<nav id="menu"></nav>

<script>
/* ========= 1. EDITA SOLO ESTA SECCIÓN CON TUS DATOS ========= */
const lista = a => "<ul>" + a.map(x => `<li>${x}</li>`).join("") + "</ul>";
const filas = o => Object.entries(o).map(([k, v]) => `<div class="row"><b>${k}</b><span>${v}</span></div>`).join("");

const COMANDOS = {
  "sobre-mi": () => `<h2>Sobre mí</h2><p>SRE, Especializado en la orquestación de contenedores con Red Hat OpenShift/Kubernetes y virtualización avanzada con VMWare y Proxmox. sólido dominio en la administración de servidores Unix/Solaris/Linux, bases de datos Oracle, automatización mediante Shell Script y despliegues en la nube de AWS.</p>`,

  "experiencia": () => `<h2>Experiencia</h2>
    <p><b>DBA · Ministerio de Presidencia</b> (2026)</p>${lista(["Alta Disponibilidad & Recuperación (HA/DR)", "Clustering & Balanceo de Carga"])}
    <p><b>SRE · Instituto Cervantes</b> (2025)</p>${lista(["Migracion GEC", "Project Management - Openshift"])}`,

  "habilidades": () => `<h2>Habilidades</h2>${lista(["Contenedores y Orquestación", "Servidores Web, Aplicaciones y CI/CD", "Project Management - Red Hat/Openshift"])}
    <h2>Herramientas</h2>${filas({
      "Sistemas": "Unix|Solaris|Linux|Windows Sever",
      "Monitorización": "Zabbix, Nagios",
      "Bases de Datos": "SQLServer, Oracle, PostgreSQL"
    })}`,

  "educacion": () => `<h2>Educación</h2>${lista(["Ingeniero de Sistemas · Universidad Simon Bolivar (COL)"])}`,

  "certificaciones": () => `<h2>Certificaciones</h2>${lista(["Arquitectura de Software · Universidad Simon Bolivar (COL)"])}`,

  "contacto": () => `<h2>Contacto</h2>${filas({
    "Email": '<a href="mailto:tu@email.com">leonardo.ramirez.polo@gmail.com</a>',
    "LinkedIn": '<a href="https://www.linkedin.com/in/leonardo-ramirez-7634a758/" target="_blank" rel="noopener">linkedin.com/in/leonardo-ramirez-7634a758</a>',
    
  })}`,

  "ayuda": () => `<h2>Comandos disponibles</h2>${filas({
    "sobre-mi": "Perfil profesional", "experiencia": "Trayectoria laboral", "habilidades": "Skills y herramientas",
    "educacion": "Formación", "certificaciones": "Certificados", "contacto": "Cómo contactarme", "clear": "Limpiar pantalla"
  })}`
};
const SALUDO = "Bienvenido. Escribe <b>ayuda</b> para ver los comandos o pulsa un botón de abajo.";
/* ============================================================ */

const term = document.getElementById("term");
const menu = document.getElementById("menu");
const hist = []; let hi = 0;

function nuevaLinea() {
  const l = document.createElement("div");
  l.className = "line";
  l.innerHTML = '<span class="p">root:~#</span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Comando">';
  term.appendChild(l);
  const inp = l.querySelector("input");
  inp.focus();
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") ejecutar(inp.value.trim().toLowerCase(), l, inp);
    if (e.key === "ArrowUp" && hist.length) { hi = Math.max(0, hi - 1); inp.value = hist[hi]; e.preventDefault(); }
    if (e.key === "ArrowDown") { hi = Math.min(hist.length, hi + 1); inp.value = hist[hi] || ""; e.preventDefault(); }
    if (e.key === "Tab") { e.preventDefault(); const m = Object.keys(COMANDOS).concat("clear").find(c => c.startsWith(inp.value.toLowerCase()) && inp.value); if (m) inp.value = m; }
  });
}

function ejecutar(cmd, linea, inp) {
  inp.replaceWith(Object.assign(document.createElement("span"), { textContent: cmd }));
  if (cmd) { hist.push(cmd); hi = hist.length; }
  if (cmd === "clear") { term.innerHTML = ""; }
  else if (cmd) {
    const out = document.createElement("div");
    out.className = "out";
    out.innerHTML = COMANDOS[cmd] ? COMANDOS[cmd]() : `<span class="err">comando no encontrado: ${cmd.replace(/[<>&]/g, "")}</span> · escribe <b>ayuda</b>`;
    term.appendChild(out);
  }
  nuevaLinea();
  term.scrollTop = term.scrollHeight;
}

[...Object.keys(COMANDOS).filter(c => c !== "ayuda"), "ayuda", "clear"].forEach(c => {
  const b = document.createElement("button");
  b.textContent = c;
  b.onclick = () => { const inp = document.getElementById("in"); inp.value = c; ejecutar(c, inp.parentElement, inp); };
  menu.appendChild(b);
});

term.addEventListener("click", () => { const i = document.getElementById("in"); if (i && !getSelection().toString()) i.focus(); });

const intro = document.createElement("div");
intro.className = "out";
intro.innerHTML = SALUDO;
term.appendChild(intro);
nuevaLinea();
</script>
</body>
</html>
